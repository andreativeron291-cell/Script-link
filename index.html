<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Scripts</title>
    <style>
        @keyframes rgbBorder {
            0% { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
            20% { border-color: #8000ff; box-shadow: 0 0 15px rgba(128, 0, 255, 0.4); }
            40% { border-color: #00d2ff; box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }
            60% { border-color: #00ff88; box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); }
            80% { border-color: #ffcc00; box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); }
            100% { border-color: #ff007f; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
        }

        @keyframes rgbText {
            0% { color: #ff007f; }
            20% { color: #8000ff; }
            40% { color: #00d2ff; }
            60% { color: #00ff88; }
            80% { color: #ffcc00; }
            100% { color: #ff007f; }
        }

        body {
            background: linear-gradient(135deg, #050508 0%, #120b1f 100%);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 340px;
            background: rgba(18, 18, 26, 0.7);
            border: 2px solid #333;
            border-radius: 24px;
            padding: 25px 20px;
            backdrop-filter: blur(10px);
            animation: rgbBorder 8s infinite;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: rgbText 6s infinite;
        }

        p {
            font-size: 12px;
            color: #b8b8d0;
            text-align: center;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .main-btn {
            background: linear-gradient(135deg, #1a1a24 0%, #252538 100%);
            color: #ffffff;
            border: 3px solid #ff007f;
            border-radius: 16px;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            width: 100%;
            text-transform: lowercase;
            text-decoration: none;
            box-sizing: border-box;
            transition: transform 0.2s, background 0.3s;
            animation: rgbBorder 5s infinite;
        }

        .main-btn:hover {
            background: linear-gradient(135deg, #252538 0%, #353550 100%);
        }

        .main-btn:active {
            transform: scale(0.95);
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            animation: rgbText 8s infinite;
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container" id="menu-principale">
        <h2>HUB SCRIPTS</h2>
        <p>Tocca un tasto per aprire il codice:</p>

        <!-- Pulsante Disasters -->
        <a href="https://pastebin.com/raw/2SghECqn" target="_blank" class="main-btn">script disasters</a>
    </div>

    <div class="footer">
        by gg_script26, andrea_susamongus29
    </div>

</body>
</html>
