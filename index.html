<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Scripts - Ultimate Edition</title>
    <style>
        @keyframes rgbBorder {
            0% { border-color: #ff007f; box-shadow: 0 0 25px rgba(255, 0, 127, 0.6), inset 0 0 15px rgba(255, 0, 127, 0.2); }
            20% { border-color: #8000ff; box-shadow: 0 0 25px rgba(128, 0, 255, 0.6), inset 0 0 15px rgba(128, 0, 255, 0.2); }
            40% { border-color: #00d2ff; box-shadow: 0 0 25px rgba(0, 210, 255, 0.6), inset 0 0 15px rgba(0, 210, 255, 0.2); }
            60% { border-color: #00ff88; box-shadow: 0 0 25px rgba(0, 255, 136, 0.6), inset 0 0 15px rgba(0, 255, 136, 0.2); }
            80% { border-color: #ffcc00; box-shadow: 0 0 25px rgba(255, 204, 0, 0.6), inset 0 0 15px rgba(255, 204, 0, 0.2); }
            100% { border-color: #ff007f; box-shadow: 0 0 25px rgba(255, 0, 127, 0.6), inset 0 0 15px rgba(255, 0, 127, 0.2); }
        }

        @keyframes rgbText {
            0% { color: #ff007f; text-shadow: 0 0 10px rgba(255, 0, 127, 0.7); }
            20% { color: #8000ff; text-shadow: 0 0 10px rgba(128, 0, 255, 0.7); }
            40% { color: #00d2ff; text-shadow: 0 0 10px rgba(0, 210, 255, 0.7); }
            60% { color: #00ff88; text-shadow: 0 0 10px rgba(0, 255, 136, 0.7); }
            80% { color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.7); }
            100% { color: #ff007f; text-shadow: 0 0 10px rgba(255, 0, 127, 0.7); }
        }

        @keyframes floatBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            background: linear-gradient(135deg, #030305, #0a0612, #020813, #05120a);
            background-size: 400% 400%;
            animation: floatBg 15s ease infinite;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            width: 100%;
            max-width: 480px;
            background: rgba(12, 12, 20, 0.85);
            border: 3px solid #ff007f;
            border-radius: 30px;
            padding: 40px 30px;
            backdrop-filter: blur(15px);
            animation: rgbBorder 8s infinite;
            box-sizing: border-box;
        }

        h2 {
            font-size: 32px;
            margin: 0 0 5px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: rgbText 6s infinite;
        }

        p {
            font-size: 14px;
            color: #c0c0e0;
            text-align: center;
            margin: 0 0 15px 0;
            letter-spacing: 1px;
        }

        .main-btn {
            background: linear-gradient(135deg, #181825 0%, #2a2a42 100%);
            color: #ffffff;
            border: 3px solid #ff007f;
            border-radius: 20px;
            padding: 22px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            width: 100%;
            text-transform: lowercase;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
            animation: rgbBorder 5s infinite;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .main-btn:hover {
            background: linear-gradient(135deg, #2a2a42 0%, #3d3d61 100%);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 25px rgba(255, 0, 127, 0.4);
        }

        .main-btn:active {
            transform: scale(0.97);
        }

        .footer {
            margin-top: 35px;
            font-size: 14px;
            animation: rgbText 8s infinite;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container" id="menu-principale">
        <h2>HUB SCRIPTS</h2>
        <p>Seleziona lo script da avviare:</p>
        
        <!-- Pulsante Troll -->
        <a href="https://pastebin.com/raw/jQsedQXP" target="_blank" class="main-btn">script troll</a>
        
        <!-- Pulsante Disasters -->
        <a href="https://pastebin.com/raw/2SghECqn" target="_blank" class="main-btn">script disasters</a>
        
        <!-- Pulsante Tutti i giochi -->
        <a href="https://pastebin.com/raw/b2EsY4St" target="_blank" class="main-btn">script (tutti i giochi)</a>
    </div>

    <div class="footer">
        by gg_script26, andrea_susamongus29
    </div>

</body>
</html>
