local function toggleFlight()
    flying = not flying
    if flying then
        flyButton.Text = "FLY: ON"
        flyButton.BackgroundColor3 = Color3.fromRGB(0, 140, 100)
        humanoid.PlatformStand = true

        controlConnection = RunService.RenderStepped:Connect(function()
            pcall(function()
                if flying and humanoidRootPart and not isAttached then
                    local camera = Workspace.CurrentCamera
                    local moveDir = humanoid.MoveDirection
                    local velocity = Vector3.new(0, 0, 0)
                    if moveDir.Magnitude > 0 then
                        velocity = camera.CFrame:VectorToWorldSpace(Vector3.new(moveDir.X, 0, moveDir.Z)) * flySpeed
                    end
                    humanoidRootPart.Velocity = velocity
                    humanoidRootPart.CFrame = CFrame.new(humanoidRootPart.Position, humanoidRootPart.Position + camera.CFrame.LookVector)
                end
            end)
        end)
    else
        flyButton.Text = "FLY: OFF"
        flyButton.BackgroundColor3 = Color3.fromRGB(25, 25, 40)
        humanoid.PlatformStand = false
        if controlConnection then controlConnection:Disconnect() end
        if humanoidRootPart then humanoidRootPart.Velocity = Vector3.new(0, 0, 0) end
    end
end
