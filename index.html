<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Scripts - Delta</title>
    <style>
        body {
            background-color: #0b0b10;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #ff0080;
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 80%;
            max-width: 300px;
        }
        .script-btn {
            background-color: #d4af37;
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.1s ease, background-color 0.2s;
        }
        .script-btn:active {
            transform: scale(0.95);
        }
        .script-btn:hover {
            background-color: #e6c547;
        }
        
        /* Finestra a comparsa (Modale stile disegno) */
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background-color: #d4af37; /* Colore giallo/carta del tuo disegno */
            color: #000000;
            padding: 20px;
            border-radius: 15px;
            width: 85%;
            max-width: 400px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.5);
        }
        .modal-content h3 {
            margin-top: 0;
            font-size: 18px;
            text-align: center;
        }
        .script-textarea {
            width: 100%;
            height: 220px;
            background-color: #1a1a1a;
            color: #00ff88;
            font-family: monospace;
            font-size: 12px;
            border: 2px solid #000;
            border-radius: 8px;
            padding: 10px;
            resize: none;
            box-sizing: border-box;
        }
        .copy-action-btn {
            background-color: #0b0b10;
            color: #d4af37;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .copy-action-btn:active {
            transform: scale(0.95);
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-end;
            margin-bottom: -10px;
            color: #000;
        }
        #notification {
            margin-top: 15px;
            color: #00ff88;
            font-weight: bold;
            text-align: center;
            font-size: 14px;
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #ff64c8;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>⚡ SELEZIONA SCRIPT ⚡</h1>

    <div class="btn-container">
        <button class="script-btn" onclick="openScriptModal('troll')">script troll</button>
        <button class="script-btn" onclick="openScriptModal('disasters')">script disasters</button>
    </div>

    <div id="notification"></div>

    <!-- Finestra Modale (Il riquadro del tuo disegno) -->
    <div id="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">X</button>
            <h3 id="modal-title">Script</h3>
            <textarea id="script-box" class="script-textarea" readonly></textarea>
            <button class="copy-action-btn" onclick="copyFromBox()">COPY</button>
        </div>
    </div>

    <div class="footer">
        by gg_script26, andrea_susamongus29
    </div>

        function openScriptModal(type) {
            let modal = document.getElementById("modal");
            let box = document.getElementById("script-box");
            let title = document.getElementById("modal-title");
            
            if (type === 'troll') {
                title.innerText = "Script Troll";
                box.value = scriptTrollCode;
            } else {
                title.innerText = "Script Disasters";
                box.value = scriptDisastersCode;
            }
            modal.style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }

        function copyFromBox() {
            let box = document.getElementById("script-box");
            box.select();
            navigator.clipboard.writeText(box.value).then(() => {
                let notice = document.getElementById("notification");
                notice.innerText = "Copiato negli appunti! 📋";
                setTimeout(() => {
                    notice.innerText = "";
                }, 2500);
            });
        }
    </script>
</body>
</html>
